[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-momo"
version = "0.1.0"
description = "Teaching-sized Momo agent harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mini-momo = "mini_momo.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["mini_momo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
